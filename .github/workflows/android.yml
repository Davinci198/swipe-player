name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - clone
          - release

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # === SETUP SWAP SPACE ===
      - name: Set up swap space (10GB)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Show memory and swap
        run: |
          echo "=== MEMORY ==="
          free -h
          echo "=== SWAP ==="
          swapon --show || echo "No swap configured"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Download DragonBones AAR
        run: |
          mkdir -p app/libs
          curl -L -o app/libs/dragonbones-release.aar \
            https://github.com/Davinci198/dragonbones-aar-prebuilt/releases/download/v1.0.0-ndk27-fix/dragonbones-release.aar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      # === CONFIGURE GRADLE MEMORY ===
      - name: Configure Gradle memory limits
        run: |
          cat >> gradle.properties << 'EOF'
          # Memory optimizations
          org.gradle.jvmargs=-Xmx3g -Xms512m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.caching=true
          org.gradle.configureondemand=true
          kotlin.daemon.jvmargs=-Xmx2g -Xms256m -XX:MaxMetaspaceSize=512m
          android.enableJetifier=true
          android.useAndroidX=true
          EOF
          echo "=== gradle.properties ==="
          cat gradle.properties

      # === BUILD ===
      - name: Build APK
        id: build
        env:
          BUILD_VARIANT: ${{ inputs.build_variant }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          
          case "$BUILD_VARIANT" in
            clone)
              TASK=":app:assembleCloneDebug"
              ;;
            release)
              TASK=":app:assembleRelease"
              ;;
            debug|*)
              TASK=":app:assembleDebug"
              ;;
          esac
          
          echo "Running: $TASK"
          echo "=== Starting build at $(date) ==="
          
          ./gradlew "$TASK" \
            --stacktrace \
            --no-daemon \
            --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx3g -Xms512m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -XX:MaxGCPauseMillis=200" \
            -Dkotlin.daemon.jvmargs="-Xmx2g -Xms256m -XX:MaxMetaspaceSize=512m"
          
          echo "=== Build finished at $(date) ==="

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SwipePlayer-${{ inputs.build_variant }}-${{ github.run_number }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 7

      # === UPLOAD LOGS ON FAILURE ===
      - name: Upload build logs on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs-${{ github.run_number }}
          path: |
            **/.gradle/worker-*/**/*.log
            **/build/reports/**
            **/build/outputs/logs/**
          retention-days: 3
