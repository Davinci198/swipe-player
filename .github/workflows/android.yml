name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Variantă build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - clone
          - release

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up swap space (10GB)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Show memory and swap
        run: |
          echo "=== MEMORY ==="
          free -h
          echo "=== SWAP ==="
          swapon --show || echo "No swap configured"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Setup Gradle
        run: |
          # Instalare Gradle 8.5 direct, fără wrapper validation
          GRADLE_VERSION=8.5
          curl -sL -o /tmp/gradle-bin.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q -o /tmp/gradle-bin.zip -d /opt
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> $GITHUB_PATH
          # Generăm wrapper properties pentru 8.5
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          echo "Gradle $GRADLE_VERSION installed"
          gradle --version

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restore Android dependency cache
        id: cache-manual-deps
        uses: actions/cache@v4
        with:
          path: manual-deps
          key: android-deps-${{ runner.os }}-${{ hashFiles('ci/script/download_android_dependencies.sh', 'ci/script/prepare_android_dependencies.py') }}

      - name: Download Android dependencies
        if: steps.cache-manual-deps.outputs.cache-hit != 'true'
        run: bash ci/script/download_android_dependencies.sh full "manual-deps"

      - name: Prepare Android dependencies
        run: |
          python3 ci/script/prepare_android_dependencies.py \
            --profile full \
            --archives "manual-deps" \
            --repository "$GITHUB_WORKSPACE"

      - name: Build APK
        env:
          BUILD_VARIANT: ${{ inputs.build_variant }}
          GRADLE_OPTS: "-Xmx4g -Xms1g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false"
        run: |
          set -euo pipefail
          case "${BUILD_VARIANT:-debug}" in
            clone) TASK=":app:assembleCloneDebug" ;;
            release) TASK=":app:assembleRelease" ;;
            debug|*) TASK=":app:assembleOriginalDebug" ;;
          esac
          
          echo "Running: gradle $TASK"
          echo "=== Starting build at $(date) ==="
          
          gradle $TASK \
            --stacktrace \
            --no-daemon \
            --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx4g -Xms1g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -XX:MaxGCPauseMillis=200" \
            -Dkotlin.daemon.jvmargs="-Xmx2g -Xms512m -XX:MaxMetaspaceSize=512m"
          
          echo "=== Build finished at $(date) ==="

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SwipePlayer-${{ inputs.build_variant || 'debug' }}-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs-${{ github.run_number }}
          path: |
            **/build/reports/
            **/build/outputs/logs/
            **/build/test-results/
            **/*.log
          retention-days: 3
