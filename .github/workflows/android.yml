name: Build APK (fără wrapper)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Variantă build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - clone
          - release

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up swap space (10GB)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Show memory
        run: free -h

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Download DragonBones AAR
        run: |
          mkdir -p app/libs
          curl -L -o app/libs/dragonbones-release.aar \
            https://github.com/Davinci198/dragonbones-aar-prebuilt/releases/download/v1.0.0-ndk27-fix/dragonbones-release.aar

      - name: Setup Gradle (instalare directă)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Build APK
        env:
          BUILD_VARIANT: ${{ inputs.build_variant }}
        run: |
          case "$BUILD_VARIANT" in
            clone) TASK=":app:assembleCloneDebug" ;;
            release) TASK=":app:assembleRelease" ;;
            debug|*) TASK=":app:assembleDebug" ;;
          esac
          
          echo "Running: gradle $TASK"
          gradle $TASK --stacktrace --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -Xms1g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SwipePlayer-${{ inputs.build_variant }}-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
