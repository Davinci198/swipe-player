name: Full APK Build
on:
  workflow_dispatch:
    inputs:
      gradle_task:
        description: Gradle task to run
        required: true
        default: ':app:assembleMainDebug'
        type: choice
        options:
          - ':app:assembleMainDebug'
          - ':app:assembleCloneDebug'
          - ':app:assembleRelease'
          - ':app:bundleRelease'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'app/**'
      - 'dragonbones/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
concurrency:
  group: build-full-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  JAVA_VERSION: '21'
  ANDROID_NDK_VERSION: '27.0.12077973'
  ANDROID_CMAKE_VERSION: '3.22.1'
  _JAVA_OPTIONS: '-Xmx4g'
jobs:
  build:
    name: Build Android artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Show free space
        run: df -h

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle + CMake
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/.cxx
            **/.cxx
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            'platforms;android-34' \
            'platforms;android-36' \
            'build-tools;34.0.0' \
            'build-tools;35.0.0' \
            'ndk;$ANDROID_NDK_VERSION' \
            'cmake;$ANDROID_CMAKE_VERSION'

      - name: Set up swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Determine Gradle task
        id: gradle-task
        run: |
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            echo 'task=${{ inputs.gradle_task }}' >> $GITHUB_OUTPUT
          else
            echo 'task=:app:assembleMainDebug' >> $GITHUB_OUTPUT
          fi

      - name: Build Android APK
        id: gradle-build
        timeout-minutes: 120
        shell: bash
        env:
          _JAVA_OPTIONS: '-Xmx4g'
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew ${{ steps.gradle-task.outputs.task }} \
            --no-daemon \
            --max-workers=1 \
            -Dorg.gradle.jvmargs='-Xmx4g -Xms2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError' \
            -Dkotlin.daemon.jvmargs='-Xmx3g -Xms1g -XX:+UseG1GC -XX:MaxGCPauseMillis=200' 2>&1 | tee gradle.log
          echo '=== BUILD COMPLETED SUCCESSFULLY ==='
          grep -i 'BUILD SUCCESSFUL' gradle.log || echo 'Build may have completed with warnings'

      - name: Upload gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: gradle.log

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-${{ github.run_number }}
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload successful Android outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: swipe-player-${{ github.run_number }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14
