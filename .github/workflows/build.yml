name: Build SwipePlayer APK

on:
  workflow_dispatch:
    inputs:
      gradle_task:
        description: Gradle task
        required: true
        default: assembleCloneDebug
        type: choice
        options:
          - assembleCloneDebug
          - assembleDebug
          - assembleRelease
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - app/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - gradle/wrapper/**

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  ANDROID_NDK_VERSION: '27.0.12077973'
  ANDROID_CMAKE_VERSION: '3.22.1'
  GRADLE_VERSION: '8.13'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          large-packages: true
          docker-images: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v4

      - name: Install NDK + CMake
        shell: bash
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "platforms;android-34" \
            "build-tools;35.0.0" \
            "ndk;$ANDROID_NDK_VERSION" \
            "cmake;$ANDROID_CMAKE_VERSION"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build APK
        id: gradle-build
        timeout-minutes: 45
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew ${{ github.event.inputs.gradle_task || 'assembleCloneDebug' }} \
            --no-daemon --max-workers=2 2>&1 | tee gradle.log
          echo "=== BUILD COMPLETED ==="
          grep -i "BUILD SUCCESSFUL" gradle.log || echo "Build finished with warnings"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SwipePlayer-APK-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14