name: Full APK Build
on:
  workflow_dispatch:
    inputs:
      gradle_task:
        description: Gradle task to run
        required: true
        default: ':app:assembleMainDebug'
        type: choice
        options:
          - assembleDebug
          - ':app:assembleNightly'
          - ':app:assembleClone'
          - ':app:bundleRelease'
  push:
    branches: [main]
    paths:
      - .github/workflows/build-full.yml
      - .github/workflows/build-quick.yml
      - .gitmodules
      - .npmrc
      - app/**
      - build.gradle.kts
      - ci/**
      - cmake/**
      - dragonbones/**
      - examples/**
      - fbx/**
      - gradle/**
      - gradle.properties
      - gradlew
      - llama/**
      - mmd/**
      - mnn/**
      - package.json
      - quickjs/**
      - settings.gradle.kts
      - terminal/**
      - tools/**
      - web-chat/**
concurrency:
  group: build-full-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'
  ANDROID_NDK_VERSION: '27.0.12077973'
  ANDROID_CMAKE_VERSION: '3.22.1'
  GRADLE_VERSION: '8.5'
  RUST_VERSION: '1.88.0'
  _JAVA_OPTIONS: "-Xmx4g"
jobs:
  build:
    name: Build Android artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Show free space
        run: df -h

      - name: Fix dragonbones CMakeLists
        run: |
          cat dragonbones/CMakeLists.txt
          echo '--- Patching for NDK27 if needed ---'
          sed -i 's/-std=c++11/-std=c++17 -faligned-new/g; s/-std=c++14/-std=c++17 -faligned-new/g' dragonbones/CMakeLists.txt || true
          grep -q 'faligned-new' dragonbones/CMakeLists.txt || echo 'target_compile_options(dragonbones_native PRIVATE -faligned-new -std=c++17)' >> dragonbones/CMakeLists.txt
          echo '--- Final CMakeLists ---'
          cat dragonbones/CMakeLists.txt

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle + CMake
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/.cxx
            **/.cxx
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "ndk;$ANDROID_NDK_VERSION" \
            "cmake;$ANDROID_CMAKE_VERSION"

      - name: Restore Android dependency cache
        id: cache-manual-deps
        uses: actions/cache@v4
        with:
          path: manual-deps
          key: android-full-deps-${{ runner.os }}-${{ hashFiles('ci/script/download_android_dependencies.sh', 'ci/script/prepare_android_dependencies.py') }}

      - name: Download Android dependencies
        if: steps.cache-manual-deps.outputs.cache-hit != 'true'
        run: bash ci/script/download_android_dependencies.sh full "manual-deps"

      - name: Prepare Android dependencies
        run: |
          python3 ci/script/prepare_android_dependencies.py \
            --profile full \
            --archives "manual-deps" \
            --repository "$GITHUB_WORKSPACE"

      - name: Install JavaScript dependencies
        if: false
        run: echo "Skipped - no package.json"

      - name: Build WebChat assets
        if: false
        run: echo "Skipped - no web-chat directory"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Build Android APK
        id: gradle-build
        timeout-minutes: 120
        shell: bash
        env:
          _JAVA_OPTIONS: "-Xmx4g"
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleMainDebug \
            --no-daemon \
            --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx4g -Xms2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError" \
            -Dkotlin.daemon.jvmargs="-Xmx3g -Xms1g -XX:+UseG1GC -XX:MaxGCPauseMillis=200" 2>&1 | tee gradle.log
          echo "=== BUILD COMPLETED SUCCESSFULLY ==="
          grep -i "BUILD SUCCESSFUL" gradle.log || echo "Build may have completed with warnings"

      - name: Run JVM unit tests
        if: >-
          !cancelled() &&
          steps.gradle-build.outcome == 'success' &&
          (github.event_name == 'push' || inputs.gradle_task)
        timeout-minutes: 15
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon -Dlint.abortOnError=false

      - name: Run Android lint
        if: >-
          !cancelled() &&
          steps.gradle-build.outcome == 'success' &&
          (github.event_name == 'push' || inputs.gradle_task)
        timeout-minutes: 10
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon -Dlint.abortOnError=false
        continue-on-error: true

      - name: Upload gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: gradle.log

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operit-android-reports-${{ github.run_number }}
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload successful Android outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: operit-clone-${{ github.run_number }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14
