name: Build Debug APK
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  NDK_VERSION: "27.0.12077973"
  CMAKE_VERSION: "3.22.1"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Node 20
        if: ${{ hashFiles('package-lock.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies (npm ci)
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 27 + CMake (only if native build is configured)
        run: |
          set -e
          if grep -qE 'ndkVersion|externalNativeBuild' app/build.gradle.kts; then
            yes | sdkmanager --install "ndk;${{ env.NDK_VERSION }}" "cmake;${{ env.CMAKE_VERSION }}" --sdk_root="$ANDROID_HOME"
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"
            echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"
          else
            echo "No native build configured in build.gradle.kts -> skipping NDK/CMake install"
          fi

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Configure Android SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Debug APK
        run: ./gradlew :app:assembleOriginalDebug --stacktrace --no-daemon

      - name: Set artifact name
        run: |
          SAFE_BRANCH=$(echo "${{ github.ref_name }}" | sed "s/\//-/g")
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          echo "artifact_name=swipe-player-debug-${SAFE_BRANCH}-${SHORT_SHA}" >> $GITHUB_ENV

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14
